name: Scrape and Update Jobs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/bot/requirements.txt

      - name: Run Job Scraper & Lifecycle Updates
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SEED_MODE: "1" # Ensures Telegram sending logic is skipped
        run: |
          cd scripts/bot
          python main.py
